name: VibeCode CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shell syntax
        run: bash -n platform/tv platform/tune platform/install.sh tests/vsh_smoke.sh bench/throughput.sh
      - name: Native build
        run: make -C native/vsh clean all
      - name: Native smoke
        run: bash tests/vsh_smoke.sh
      - name: Native benchmark
        run: make -C native/vsh check
      - name: Python tests
        run: python -m pip install -q pytest && pytest -q tests/test_tvd.py tests/test_supervisor.py
