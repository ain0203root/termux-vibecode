name: Termux Package

on:
  push:
    branches: [main, 'forge/**']
  pull_request:
  workflow_dispatch:

jobs:
  tvsh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build tvsh with Termux package builder
        run: bash ci/build-termux-package.sh
      - name: Verify package artifact
        run: |
          test -f dist/tvsh_*.deb
          dpkg-deb --info dist/tvsh_*.deb >/dev/null
          dpkg-deb --contents dist/tvsh_*.deb | grep -Eq '/usr/bin/vsh$'
      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: tvsh-x86_64-deb
          path: dist/tvsh_*.deb
          if-no-files-found: error
