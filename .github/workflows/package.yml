name: Termux Package

on:
  push:
    branches: [main, 'forge/**']
  pull_request:
  workflow_dispatch:

jobs:
  tvsh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build tvsh with Termux package builder
        run: bash ci/build-termux-package.sh
      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: tvsh-x86_64-deb
          path: '**/output/tvsh_*.deb'
          if-no-files-found: error
