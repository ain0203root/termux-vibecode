name: Termux Package

on:
  push:
    branches: [main, 'forge/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: vibecode-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tvsh:
    name: tvsh (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - name: Build tvsh with Termux package builder
        env:
          TERMUX_ARCH: ${{ matrix.arch }}
        run: bash ci/build-termux-package.sh
      - name: Verify package artifact
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          packages=(dist-${ARCH}/tvsh_*.deb)
          test "${#packages[@]}" -eq 1
          dpkg-deb --info "${packages[0]}" >/dev/null
          dpkg-deb --contents "${packages[0]}" | grep -Eq '^\./data/data/com\.termux/files/usr/bin/vsh$'
          dpkg-deb --contents "${packages[0]}" | grep -Eq '^\./data/data/com\.termux/files/usr/share/doc/tvsh/copyright$'
      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: tvsh-${{ matrix.arch }}-deb
          path: dist-${{ matrix.arch }}/tvsh_*.deb
          if-no-files-found: error
